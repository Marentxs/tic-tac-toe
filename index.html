<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>
  <body>
    <div id="container">
      <span class="title">Tic Tac Toe!</span>
      <div id="boardDisplay"></div>
      <span class="message">Make the first move</span>
      <div class="buttons">
        <button class="names">Change Names</button>
        <button class="reset">Restart</button>
      </div>
    </div>
    <div class="popup" id="popup">
      <div>
        <form id="playersForm" action="" method="get">
          <label for="player1">Player 1:</label>
          <input type="text" name="name1" id="player1" />

          <label for="player2">Player 2:</label>
          <input type="text" name="name2" id="player2" />

          <div class="formButtons">
            <button class="form">Confirm</button>
            <button class="close" id="close">Cancel</button>
          </div>
        </form>
      </div>
    </div>
    <div class="footer">
      <a
        href="https://www.theodinproject.com/lessons/node-path-javascript-tic-tac-toe"
        target="_blank"
        ><span>The Odin Project 2025</span></a
      >
      <span> - </span>
      <a href="https://github.com/Marentxs" target="_blank"
        ><span>My github</span></a
      >
    </div>
    <script src="javascript.js"></script>
  </body>
</html>
